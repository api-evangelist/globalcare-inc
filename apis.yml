name: GlobalCare Inc.
description: 'GlobalCare Inc. was a healthcare technology company founded in 1994 and based in Portland,
  Oregon, that provided solutions enabling healthcare payers to significantly reduce the cost of out-of-network
  claims. Backed by an investor group led by Insight Venture Partners (Series A Preferred Stock), GlobalCare
  merged into Zelis Healthcare in January 2016 and no longer operates as an independent entity. Its out-of-network
  claims-pricing capabilities are now delivered through Zelis. GlobalCare Inc. itself publishes no independent
  developer portal, API documentation, or machine-readable API surface; any current API surface is Zelis''s
  (developer.zelis.com), tracked separately in the network.'
